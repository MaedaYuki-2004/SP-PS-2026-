<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理ログイン — SP-PS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="/static/css/base.css" rel="stylesheet">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .login-page { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
    .login-card { width:100%; max-width:360px; background:var(--bg-card, #fff); border:1px solid var(--border); border-radius:16px; padding:32px 28px; text-align:center; }
    .login-icon  { font-size:34px; margin-bottom:12px; }
    .login-title { font-size:18px; font-weight:700; color:var(--navy); margin-bottom:6px; }
    .login-sub   { font-size:12px; color:var(--text-3); line-height:1.7; margin-bottom:22px; }
    .login-form  { display:flex; flex-direction:column; gap:12px; }
    .login-input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:var(--font); background:transparent; color:var(--text); }
    .login-input:focus { outline:none; border-color:var(--navy); }
    .login-error { font-size:12px; font-weight:600; color:var(--accent, #C03D20); }
  </style>
</head>
<body>
<nav class="top-nav">
  <a href="/select" class="nav-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ホーム
  </a>
</nav>
<div class="login-page">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <div class="login-title">管理ログイン</div>
    <div class="login-sub">単語の追加・削除・お手本の差し替えには<br>管理パスワードが必要です</div>
    <form class="login-form" method="post" action="/admin/login">
      <input class="login-input" type="password" name="password" placeholder="管理パスワード" autofocus autocomplete="current-password">
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">ログイン</button>
    </form>
  </div>
</div>
</body>
</html>
