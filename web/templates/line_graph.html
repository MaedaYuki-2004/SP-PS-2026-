<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/1.0.2/chartjs-plugin-annotation.min.js"></script>
    <style>
      .chart-container1 {
        display: flex;
        justify-content: space-between;
        justify-content: center; /* Center horizontally */
        /* align-items: center; Center vertically */
        /* height: 100vh; 100% of the viewport height */
      }
      .chart {
        width: 48%; /* Adjust the width as needed */
      }
      #PitchLengthChart {
        width: 800px !important; /* Adjust the width as needed */
        height: 500px !important; /* Adjust the height as needed */
      }
    </style>
  </head>
  <body>
    <div class="chart-container1">
      <canvas id="PitchLengthChart" class="chart"></canvas>
    </div>
    <script>
      var ctx = document.getElementById('PitchLengthChart').getContext('2d');
      var chartVisible = false // Initially, the chart is visible

      var data = {
          labels:{{x_axis}},
          datasets: [{
              label:'SampleVoice',
              data: {{pitch_fin | tojson | safe }},
              backgroundColor: 'rgba(255, 159, 64, 0.2)',
              borderColor: 'rgba(255, 159, 64, 1)',
          },{
              label:'YourVoice',
              data: {{pitch_fin2 | tojson | safe }},
              backgroundColor: 'rgba(75, 192, 192, 0.2)',
              borderColor: 'rgba(75, 192, 192, 1)',
          }],
      };

      var values = {{ mora_values | tojson | safe }};
      var labels = {{ mora_labels | tojson | safe }};

      var factor_annotations = [];

      // Loop through the arrays and create annotations
      for (var i = 0; i < values.length; i++) {
          factor_annotations.push({
              type: 'line',
              mode: 'vertical',
              scaleID: 'x',
              value: values[i],
              borderColor: 'red',
              borderWidth: 1,
              label: {
                  content: labels[i],
                  enabled: true,
                  position: 'top'
              }
          });
      }

      var areaChart = new Chart(ctx, {
          type: 'line',
          data: data,
          options: {
              scales: {
                  x: {
                      min: -5,
                      type: 'linear',
                      position: 'bottom',
                      title: {
                          display: true,
                          text: 'Value'
                      }
                  },
                  y: {
                      title: {
                          display: true,
                          text: 'Normalized Data'
                      }
                  }
              },
              plugins: {
                  annotation: {
                      annotations: factor_annotations
                  }
              },
              elements:{
                  point:{
                      radius: 0
                  }
              },
          }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grouped Bar Mora Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
      .chart-container1 {
        display: flex;
        justify-content: space-between;
        justify-content: center; /* Center horizontally */
        /* align-items: center; /* Center vertically */
        /* height: 100vh; 100% of the viewport height */
      }
      .chart {
        width: 48%; /* Adjust the width as needed */
      }
      #groupedBarChart1 {
        width: 800px !important; /* Adjust the width as needed */
        height: 500px !important; /* Adjust the height as needed */
      }
    </style>
  </head>
  <body>
    <div class="chart-container1">
      <canvas id="groupedBarChart1" class="chart"></canvas>
    </div>

    <script>
      var chartVisible = false // Initially, the chart is visible

      var native_mora_labels = {{ mora_labels | tojson | safe }};
      var native_mora_length = {{ Native_mora_length | tojson | safe }};
      var user_mora_labels = {{ mora_labels | tojson | safe }};
      var user_mora_length = {{ User_mora_length | tojson | safe }};

      var ctx2 = document.getElementById('groupedBarChart1').getContext('2d');

      // Function to generate datasets dynamically
      function generateDatasets(labels, data, backgroundColor, borderColor) {
          return labels.map((label, index) => ({
              label: label,
              data: data.map(d => d[index]),
              backgroundColor: backgroundColor[index],
              borderColor: borderColor[index],
              borderWidth: 1
          }));
      }

      var groupedBarChart = new Chart(ctx2, {
          type: 'bar',
          data: {
              labels: ['SampleVoice', 'YourVoice'],
              datasets: [
                  ...generateDatasets(native_mora_labels, [native_mora_length, user_mora_length], [
                      'rgba(75, 192, 192, 0.2)',
                      'rgba(255, 99, 132, 0.2)',
                      'rgba(255, 206, 86, 0.2)',
                      'rgba(201, 203, 207, 0.2)'
                  ], [
                      'rgba(75, 192, 192, 1)',
                      'rgba(255, 99, 132, 1)',
                      'rgba(255, 206, 86, 1)',
                      'rgba(201, 203, 207, 1)'
                  ])
              ]
          },
          options: {
              indexAxis: 'y',
              scales: {
                  x: {
                      max: 100,
                      title: {
                          display: true,
                          text: 'Percentage(%)'
                      },
                      stacked: true
                  },
                  y: {
                      stacked: true
                  }
              },
              plugins: {
                  datalabels: {
                      formatter: function (value, context) {
                          return context.dataset.label
                      }
                  }
              },
              layout: {
                  padding: {
                      top: 50
                  }
              },
              maintainAspectRatio: false,
          },
          plugins: [ChartDataLabels]
      });
    </script>
  </body>
</html>
