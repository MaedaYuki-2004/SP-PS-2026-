{% from "_icons.html" import app_mark %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめの設定 — SP-PS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
  <script src="/static/js/theme.js"></script>
  <link href="/static/css/base.css" rel="stylesheet">
  <style>
    /* ログイン：テーマカラーの光の上に、カードを1枚浮かせる */
    body { background-color:var(--bg);
           background-image:radial-gradient(120% 60% at 50% -10%, rgba(116,101,255,.30), rgba(116,101,255,0) 62%),
                            radial-gradient(70% 40% at 100% 100%, rgba(61,140,255,.14), rgba(61,140,255,0) 70%); }
    .auth-wrap { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px 18px; }
    .auth-brand { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
    /* アプリのしるし（口の開き い・え・あ）は「SP-PS」の横に置く。形と色は _icons.html の app_mark */
    .auth-lockup { display:flex; align-items:center; gap:12px; }
    .auth-logo { width:44px; height:44px; border-radius:14px; display:block; flex:none;
                 box-shadow:0 6px 16px -10px rgba(40,30,120,.45); }
    .auth-name { font-family:var(--font-num); font-size:28px; font-weight:800; color:var(--text); letter-spacing:-.01em; }
    .auth-tag { font-size:14px; color:var(--text-2); }
    .auth-card { width:100%; max-width:400px; background:var(--glass); border:1px solid var(--glass-line);
                 backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%);
                 border-radius:30px; padding:28px 22px 24px; }
    body .auth-card { box-shadow:var(--elev-2); }
    .auth-title { font-size:22px; font-weight:700; color:var(--text); }
    .auth-sub { font-size:14px; color:var(--text-3); margin-top:4px; margin-bottom:22px; line-height:1.6; }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label { font-size:13px; font-weight:700; color:var(--text-2); }
    .field input { font-family:var(--font); font-size:16px; padding:14px 16px; min-height:54px; border:1.5px solid transparent;
                   border-radius:16px; background:var(--bg-muted); color:var(--text); width:100%;
                   transition:border-color var(--dur),box-shadow var(--dur),background var(--dur); }
    .field input:focus { outline:none; background:var(--bg-card); border-color:var(--navy); box-shadow:0 0 0 4px color-mix(in srgb, var(--navy) 16%, transparent); }
    .field .hint { font-size:12px; color:var(--text-3); }
    .btn-primary { width:100%; min-height:58px; margin-top:4px; font-family:var(--font); font-size:17px; font-weight:700; color:#fff;
                   background:var(--grad-brand); box-shadow:var(--shadow-brand); border:none; border-radius:18px; padding:12px;
                   cursor:pointer; transition:filter var(--dur), transform .15s var(--ease); }
    .btn-primary:hover { filter:brightness(1.06); }
    .btn-primary:active { transform:scale(.98); }
    .auth-error { display:flex; gap:8px; align-items:flex-start; background:var(--danger-bg); color:var(--danger); border:none;
                  border-radius:16px; padding:12px 14px; font-size:14px; font-weight:600; margin-bottom:16px; line-height:1.6; }
    .auth-note { font-size:13px; color:var(--text-3); margin-top:16px; line-height:1.7; padding:12px 14px; border-radius:16px; background:var(--bg-muted); }
    .id-chip { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-num); font-size:14px; font-weight:700; color:var(--navy);
               background:var(--navy-soft); border-radius:100px; padding:4px 12px; margin-bottom:20px; }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:78px !important; }
    .pw-toggle { position:absolute; right:7px; top:50%; transform:translateY(-50%); min-height:40px; padding:0 12px; border:none;
                 border-radius:12px; background:var(--bg-card); box-shadow:var(--elev-1); color:var(--text-2); font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-lockup"><span class="auth-logo">{{ app_mark(44) }}</span><span class="auth-name">SP-PS</span></div>
      <span class="auth-tag">声と口の形で、発音をれんしゅう</span>
    </div>
    <div class="auth-card">
      <div class="auth-title">はじめの設定</div>
      <div class="auth-sub">ログイン用のパスワードを決めます。</div>
      <span class="id-chip">利用者ID：{{ user_id }}</span>

      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

      <form method="post" action="/first_login" autocomplete="off">
        <input type="hidden" name="user_id" value="{{ user_id }}">

        <div class="field">
          <label for="password">パスワード</label>
          <div class="pw-wrap"><input type="password" id="password" name="password" required minlength="6"
                 placeholder="6文字以上"><button type="button" class="pw-toggle" data-for="password">表示</button></div>
          <span class="hint">忘れないものにしてください。</span>
        </div>
        <div class="field">
          <label for="password2">パスワード（確認）</label>
          <div class="pw-wrap"><input type="password" id="password2" name="password2" required minlength="6"
                 placeholder="もう一度入力"><button type="button" class="pw-toggle" data-for="password2">表示</button></div>
        </div>

        <button type="submit" class="btn-primary">設定してはじめる</button>
      </form>
    </div>
  </div>
  <script>
    // パスワードの表示／非表示
    document.querySelectorAll('.pw-toggle').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = document.getElementById(b.dataset.for);
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.textContent = show ? 'かくす' : '表示';
      });
    });
  </script>
</body>
</html>
