<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エラー {{ code }} — SP-PS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="static/css/base.css" rel="stylesheet">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .error-page { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 24px; }
    .error-code  { font-family:var(--mono); font-size:72px; font-weight:500; color:var(--border); line-height:1; margin-bottom:18px; }
    .error-title { font-size:22px; font-weight:700; color:var(--navy); margin-bottom:10px; }
    .error-msg   { font-size:14px; color:var(--text-3); max-width:400px; line-height:1.75; margin-bottom:28px; }
    .error-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
<nav class="top-nav">
  <a href="/select" class="nav-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ホーム
  </a>
</nav>
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <div class="error-title">{{ title }}</div>
  <div class="error-msg">{{ message }}</div>
  <div class="error-actions">
    <a href="/select" class="btn btn-primary">ホームに戻る</a>
    <button onclick="history.back()" class="btn btn-ghost">前のページに戻る</button>
  </div>
</div>
</body>
</html>
