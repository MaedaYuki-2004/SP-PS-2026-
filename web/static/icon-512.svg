<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="512" height="512">
  <!-- アプリのしるし：左から「い」「え」「あ」と口を開いていく形（_icons.html の app_mark と同じ形）。
       manifest.json で maskable を指定しているため、角は丸めず全面を塗る（角の丸め方は端末が決める）。
       形は中央 80% の安全領域に収めている。 -->
  <rect width="96" height="96" fill="#F3F2FF"/>
  <ellipse cx="24" cy="48" rx="8.5" ry="3.5" fill="#4A3AD0"/>
  <ellipse cx="48" cy="48" rx="8.5" ry="8" fill="#4A3AD0"/>
  <ellipse cx="72" cy="48" rx="8.5" ry="15" fill="#4A3AD0"/>
</svg>
